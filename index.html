<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e4a2e">
  <meta name="description" content="Manny: swipe to help Filipinos pay their bills. Demo with pretend money.">
  <title>Manny</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Manny">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="top">
      <button class="icon-btn" id="menuBtn" aria-label="Menu">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="brand"><span class="brand-seal">M</span><span class="brand-name">Manny</span><span class="pill" id="demoPill">DEMO</span></div>
      <button class="wallet" id="walletBtn" aria-label="Demo wallet"><span class="w-ic" id="walletSym">₱</span><span id="walletAmt">₱0</span></button>
    </header>

    <main id="view" class="view"></main>

    <nav class="tabs">
      <button data-tab="discover">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="3" transform="rotate(-8 12 12)"/><path d="M12 15.5s-3.2-2-3.2-4.1A1.7 1.7 0 0 1 12 10.6a1.7 1.7 0 0 1 3.2.8c0 2.1-3.2 4.1-3.2 4.1z"/></svg>
        <span class="lbl">Discover</span>
      </button>
      <button data-tab="giving">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9.5v5M18 9.5v5"/></svg>
        <span class="lbl">My giving</span><span class="dot" hidden></span>
      </button>
      <button data-tab="ask">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11V6.5a1.5 1.5 0 0 1 3 0V11M10 10V5a1.5 1.5 0 0 1 3 0v5M13 10V6a1.5 1.5 0 0 1 3 0v6M16 10.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1.2a6 6 0 0 1-4.6-2.2L4.4 15.6a1.5 1.5 0 0 1 2.3-1.9L7 14"/></svg>
        <span class="lbl">Ask for help</span>
      </button>
    </nav>
  </div>

  <div id="sheet" hidden></div>
  <div id="overlay" hidden></div>
  <div id="intro" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="i18n.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
